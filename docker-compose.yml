services:
  atmos-track-splitter:
    build: .
    image: quinnuk/atmos-track-splitter:debian
    container_name: atmos-track-splitter
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/London}
      CUSTOM_USER: ${CUSTOM_USER:?Set CUSTOM_USER in .env}
      PASSWORD: ${PASSWORD:?Set a strong PASSWORD in .env}
      ATMOS_RIPS_DIR: /rips
      ATMOS_OUTPUT_DIR: /music-videos
      TITLE: Atmos Track Splitter
    volumes:
      - ./config:/config
      - ${RIPS_PATH:?Set RIPS_PATH in .env}:/rips:ro
      - ${MUSIC_VIDEOS_PATH:?Set MUSIC_VIDEOS_PATH in .env}:/music-videos:rw
    ports:
      - "3001:3001"
    shm_size: "1gb"
    restart: unless-stopped
