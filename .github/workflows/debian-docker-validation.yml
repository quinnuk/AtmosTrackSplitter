name: Debian Docker validation

on:
  push:
    branches:
      - feature/debian-docker-auto-tracklists
  pull_request:
    branches:
      - main

jobs:
  python-and-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Docker app requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
      - name: Compile Python files
        run: python -m compileall -q main.py extractor.py settings.py poster_art.py
      - name: Test generated Plex artwork dimensions
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image
          import poster_art

          source = BytesIO()
          Image.new("RGB", (1200, 1200), (35, 70, 110)).save(source, format="JPEG")
          with TemporaryDirectory() as temp:
              root = Path(temp)
              poster = poster_art.create_plex_poster(
                  source.getvalue(), root / "poster.jpg", "Test Artist", "Test Album", "2024"
              )
              cover = poster_art.create_square_cover(
                  source.getvalue(), root / "cover.jpg"
              )
              with Image.open(poster) as image:
                  assert image.size == (1000, 1500), image.size
              with Image.open(cover) as image:
                  assert image.size == (1000, 1000), image.size
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Debian Docker image
        run: docker build --tag atmos-track-splitter:test .
